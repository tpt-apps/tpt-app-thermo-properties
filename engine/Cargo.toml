[package]
name = "tpt-thermo-engine"
version = "0.1.0"
edition = "2021"
description = "Refrigerant property + cycle engine for TPT Thermo Properties: single-point P/T/h lookups and (pro) refrigeration/Rankine cycle analysis. Pure Rust, no UI deps, host-testable."
publish = false

[features]
default = []
# Pro edition capabilities: Rankine-cycle analysis over IAPWS-IF97 water.
# Compiled out of the free WASM build to keep the payload small; the
# refrigeration-cycle side is correlation-based and stays in the default set
# behind the app-level `pro` feature.
pro = ["dep:tpt-eng-props-water", "dep:tpt-math-units"]

[dependencies]
# Published crates.io version strings (ecosystem convention for cross-repo
# deps): IAPWS-IF97 water/steam for the Rankine cycle side, plus its uom
# facade for the typed SI units.
tpt-eng-props-water = { version = "0.1.0", optional = true }
tpt-math-units = { version = "0.1.0", optional = true }
# Instant that works on wasm32 (performance.now) and native hosts alike.
web-time = "1"
